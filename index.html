<!DOCTYPE html>
  <html lang="en">
  <head>

      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>MetroDrone - Metronome + Drone</title>

      <!-- 
          MetroDrone: A simple metronome + drone app for music practice
          
          To host on GitHub Pages:
          1. Create a new GitHub repository
          2. Upload this index.html file AND MetroDrone_2.png to the root
          3. Enable GitHub Pages in repository Settings > Pages > Source: main branch
          4. Your app will be live at: https://yourusername.github.io/reponame/
          
          To embed in WordPress:
          Use this HTML block (IMPORTANT: include the allow attribute for mobile audio):
          <iframe src="https://yourusername.github.io/reponame/"
                  width="100%"
                  height="580px"
                  style="border: none;"
                  allow="autoplay; microphone"></iframe>

          IMPORTANT FOR MOBILE:
          - All MP3 files MUST be uploaded to the same directory as index.html
          - The iframe MUST have the "allow" attribute for audio to work on mobile
      -->

      <!-- Load Tone.js from CDN -->
      <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>

      <style>
          /* ==========================================================
             MetroDrone — FiddleHed brand skin ("Poster" direction)
             Obsolete headings + Karla body · red #990034 on cream #FBF6EC
             Style source: fiddlehed-content/Knowledge/brand-style.md
             ========================================================== */
          @import url('https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,700;1,400&display=swap');

          @font-face {
              font-family: 'Obsolete';
              src: url('Obsolete.woff2') format('woff2'),
                   url('Obsolete.woff') format('woff');
              font-display: swap;
          }

          :root {
              --fh-red: #990034;
              --fh-red-dark: #7a0029;
              --fh-cream: #FBF6EC;
              --fh-ink: #1d1a16;
              --fh-gray: #666666;
              --fh-line: #d8cfbe;
              --fh-pink: #e8b7c6;
          }

          * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
          }

          @keyframes statusPulse {
              0%, 100% { opacity: 1; }
              50% { opacity: 0.45; }
          }

          body {
              font-family: 'Karla', -apple-system, BlinkMacSystemFont, sans-serif;
              background: #efe7d8;
              min-height: 100vh;
              display: flex;
              justify-content: center;
              align-items: center;
              padding: 15px 20px;
              color: var(--fh-gray);
          }

          .container {
              background: var(--fh-cream);
              border-radius: 8px;
              box-shadow: 0 8px 26px rgba(29, 26, 22, 0.18);
              max-width: 480px;
              width: 100%;
              overflow: hidden;
          }

          /* ---- Masthead ---- */
          .band {
              background: var(--fh-red);
              padding: 20px 28px 16px;
              text-align: center;
          }

          .wordmark {
              font-family: 'Obsolete', Georgia, serif;
              font-weight: normal;
              color: var(--fh-cream);
              font-size: 2.5rem;
              line-height: 1;
          }

          .band-tag {
              color: var(--fh-pink);
              font-size: 0.72rem;
              letter-spacing: 3px;
              text-transform: uppercase;
              margin-top: 7px;
          }

          .app-body {
              padding: 20px 28px 0;
          }

          .ios-warning {
              background: var(--fh-red);
              color: var(--fh-cream);
              padding: 10px 14px;
              border-radius: 6px;
              margin-bottom: 14px;
              text-align: center;
              font-size: 0.9em;
              font-weight: 700;
          }

          .control-group {
              margin-bottom: 15px;
          }

          label {
              display: block;
              font-weight: 700;
              color: var(--fh-ink);
              margin-bottom: 6px;
              font-size: 0.72em;
              text-transform: uppercase;
              letter-spacing: 1.5px;
          }

          input[type="number"],
          select {
              width: 100%;
              padding: 10px 12px;
              font-size: 1em;
              font-family: 'Karla', sans-serif;
              color: var(--fh-ink);
              border: 1.5px solid var(--fh-ink);
              border-radius: 6px;
              background: #fffdf7;
              font-weight: 500;
          }

          input[type="number"]:focus,
          select:focus {
              outline: none;
              border-color: var(--fh-red);
              box-shadow: 0 0 0 2px rgba(153, 0, 52, 0.15);
          }

          /* ---- Tempo hero ---- */
          .tempo-hero {
              text-align: center;
          }

          .tempo-hero input[type="number"] {
              font-family: 'Obsolete', Georgia, serif;
              font-size: 3.6rem;
              line-height: 1;
              color: var(--fh-ink);
              background: transparent;
              border: none;
              width: 170px;
              text-align: center;
              padding: 0;
              -moz-appearance: textfield;
              appearance: textfield;
          }

          .tempo-hero input[type="number"]::-webkit-outer-spin-button,
          .tempo-hero input[type="number"]::-webkit-inner-spin-button {
              -webkit-appearance: none;
              margin: 0;
          }

          .tempo-hero input[type="number"]:focus {
              outline: none;
              box-shadow: none;
              color: var(--fh-red);
          }

          .bpm-label {
              font-family: 'Obsolete', Georgia, serif;
              font-weight: normal;
              color: var(--fh-red);
              font-size: 0.8rem;
              letter-spacing: 3px;
              text-transform: uppercase;
              margin: 2px 0 8px;
          }

          /* ---- Sliders ---- */
          input[type="range"] {
              width: 100%;
              height: 4px;
              border-radius: 2px;
              background: var(--fh-line);
              outline: none;
              -webkit-appearance: none;
              appearance: none;
              margin-top: 6px;
          }

          input[type="range"]::-webkit-slider-thumb {
              -webkit-appearance: none;
              appearance: none;
              width: 20px;
              height: 20px;
              border-radius: 50%;
              background: var(--fh-red);
              border: 2px solid var(--fh-cream);
              box-shadow: 0 1px 4px rgba(29, 26, 22, 0.35);
              cursor: pointer;
              transition: transform 0.15s ease;
          }

          input[type="range"]::-webkit-slider-thumb:hover {
              transform: scale(1.15);
          }

          input[type="range"]::-moz-range-thumb {
              width: 20px;
              height: 20px;
              border-radius: 50%;
              background: var(--fh-red);
              border: 2px solid var(--fh-cream);
              box-shadow: 0 1px 4px rgba(29, 26, 22, 0.35);
              cursor: pointer;
              transition: transform 0.15s ease;
          }

          input[type="range"]::-moz-range-thumb:hover {
              transform: scale(1.15);
          }

          .tempo-inputs {
              display: flex;
              flex-direction: column;
              align-items: center;
          }

          .tempo-inputs input[type="range"] {
              margin-top: 0;
          }

          /* ---- String buttons ---- */
          .string-buttons {
              display: flex;
              gap: 8px;
          }

          .string-buttons .string-btn {
              flex: 1;
              padding: 9px 4px;
              font-size: 1em;
              font-weight: 700;
              font-family: 'Karla', sans-serif;
              border: 1.5px solid var(--fh-ink);
              border-radius: 6px;
              background: #fffdf7;
              color: var(--fh-ink);
              cursor: pointer;
              text-transform: none;
              letter-spacing: 0;
              transition: all 0.15s ease;
              display: flex;
              flex-direction: column;
              align-items: center;
              line-height: 1.1;
          }

          .string-buttons .string-btn small {
              font-size: 0.55em;
              font-weight: 600;
              color: var(--fh-gray);
          }

          .string-buttons .string-btn:hover {
              border-color: var(--fh-red);
              color: var(--fh-red);
          }

          .string-buttons .string-btn.active {
              background: var(--fh-red);
              border-color: var(--fh-red);
              color: var(--fh-cream);
          }

          .string-buttons .string-btn.active small {
              color: var(--fh-pink);
          }

          .tuning-layout {
              display: flex;
              gap: 14px;
              align-items: center;
              margin-top: 12px;
          }

          .tuning-selects label {
              margin-bottom: 0;
          }

          .tuning-selects {
              display: flex;
              flex-direction: column;
              gap: 10px;
              flex: 1;
              min-width: 0;
          }

          .tuning-selects select {
              padding: 10px 12px;
              font-size: 0.95em;
          }

          .fingerboard-container {
              display: flex;
              justify-content: center;
              flex-shrink: 0;
          }

          .fingerboard-container > div {
              background: var(--fh-cream);
              border: 1px solid var(--fh-line);
              border-radius: 6px;
              padding: 10px 16px 6px 16px;
              line-height: 0;
          }

          /* ---- Transport ---- */
          .transport-buttons {
              display: flex;
              gap: 12px;
              margin-top: 18px;
          }

          button {
              flex: 1;
              padding: 12px;
              font-size: 1.15em;
              font-family: 'Obsolete', Georgia, serif;
              font-weight: normal;
              border-radius: 6px;
              cursor: pointer;
              transition: all 0.15s ease;
              text-transform: uppercase;
              letter-spacing: 3px;
          }

          button span {
              position: relative;
          }

          .btn-start {
              background: var(--fh-ink);
              color: var(--fh-cream);
              border: 1.5px solid var(--fh-ink);
          }

          .btn-start:hover {
              background: var(--fh-red);
              border-color: var(--fh-red);
          }

          .btn-stop {
              background: transparent;
              color: var(--fh-ink);
              border: 1.5px solid var(--fh-ink);
          }

          .btn-stop:hover {
              color: var(--fh-red);
              border-color: var(--fh-red);
          }

          button:active {
              transform: translateY(1px);
          }

          .status {
              text-align: center;
              margin-top: 12px;
              color: var(--fh-gray);
              font-size: 0.85em;
              font-style: italic;
              min-height: 20px;
          }

          .status.playing {
              color: var(--fh-red);
              animation: statusPulse 2s ease-in-out infinite;
          }

          /* ---- Art footer ---- */
          .art {
              margin-top: 14px;
              border-top: 1px solid var(--fh-line);
          }

          .art img {
              display: block;
              width: 100%;
              height: auto; /* show the full crop — no CSS re-cropping */
              mix-blend-mode: multiply;
              opacity: 0.9;
          }

          @media (max-width: 600px) {
              .app-body {
                  padding: 16px 20px 0;
              }

              .wordmark {
                  font-size: 2.1rem;
              }

              .control-group {
                  margin-bottom: 12px;
              }

              button {
                  padding: 11px;
                  font-size: 1.05em;
              }

              .tempo-hero input[type="number"] {
                  font-size: 3rem;
              }
          }
      </style>
  </head>
  <body>
      <div class="container">

          <div class="band">
              <h1 class="wordmark">MetroDrone</h1>
              <div class="band-tag">FiddleHed &middot; Practice Tools</div>
          </div>
          <div class="app-body">
          <!-- iOS Silent Switch Warning (only shown on iOS) -->
          <div id="iosWarning" class="ios-warning" style="display: none;">
              📱 <strong>iOS Users:</strong> Turn OFF Silent Mode (toggle switch on left side) to hear audio!
          </div>

          <!-- Tempo Control -->
          <div class="control-group tempo-hero" id="tempoGroup">
              <input type="number" id="tempoNumber" min="40" max="200" value="80">
              <label for="tempoNumber" class="bpm-label">Beats Per Minute</label>
              <div class="tempo-inputs">
                  <input type="range" id="tempoSlider" min="40" max="200" value="80">
              </div>
          </div>

          <!-- Drone Source -->
          <div class="control-group">
              <label for="droneSource">Drone mode</label>
              <select id="droneSource">
                  <option value="mp3" selected>Strings</option>
                  <option value="tuning">Tuning Tone</option>
              </select>
          </div>

          <!-- Drone Root Note -->
          <div class="control-group" id="droneRootGroup">
              <label for="droneRoot">Drone root</label>
              <select id="droneRoot">
                  <option value="C">C</option>
                  <option value="C#">C#</option>
                  <option value="D" selected>D</option>
                  <option value="D#">D#</option>
                  <option value="E">E</option>
                  <option value="F">F</option>
                  <option value="F#">F#</option>
                  <option value="G">G</option>
                  <option value="G#">G#</option>
                  <option value="A">A</option>
                  <option value="A#">A#</option>
                  <option value="B">B</option>
              </select>
          </div>

          <!-- Tuning Tone Controls (hidden unless Tuning Tone source is selected) -->
          <div class="control-group" id="tuningControls" style="display: none;">
              <label>Open strings</label>
              <div class="string-buttons">
                  <button type="button" class="string-btn" data-note="G" data-octave="3">G</button>
                  <button type="button" class="string-btn active" data-note="D" data-octave="4">D</button>
                  <button type="button" class="string-btn" data-note="A" data-octave="4">A</button>
                  <button type="button" class="string-btn" data-note="E" data-octave="5">E</button>
              </div>
              <div class="tuning-layout">
                  <div class="tuning-selects">
                      <label for="tuningNote">Any note (C3&ndash;D6)</label>
                      <select id="tuningNote">
                          <option value="C">C</option>
                          <option value="C#">C#</option>
                          <option value="D" selected>D</option>
                          <option value="D#">D#</option>
                          <option value="E">E</option>
                          <option value="F">F</option>
                          <option value="F#">F#</option>
                          <option value="G">G</option>
                          <option value="G#">G#</option>
                          <option value="A">A</option>
                          <option value="A#">A#</option>
                          <option value="B">B</option>
                      </select>
                      <select id="tuningOctave">
                          <option value="3">Low (3)</option>
                          <option value="4" selected>Mid (4)</option>
                          <option value="5">High (5)</option>
                          <option value="6">Highest (6)</option>
                      </select>
                  </div>
                  <!-- Live fingerboard diagram showing where the tuning note lives -->
                  <div class="fingerboard-container">
                      <div id="fingerboardDisplay"></div>
                  </div>
              </div>
          </div>

          <!-- Drone Volume -->
          <div class="control-group">
              <label for="droneVolume">Drone volume</label>
              <input type="range" id="droneVolume" min="0" max="100" value="50">
          </div>

          <!-- Metronome Volume -->
          <div class="control-group" id="metronomeVolumeGroup">
              <label for="metronomeVolume">Metronome volume</label>
              <input type="range" id="metronomeVolume" min="0" max="100" value="50">
          </div>

          <!-- Transport Buttons -->
          <div class="transport-buttons">
              <button class="btn-start" id="startBtn"><span>Start</span></button>
              <button class="btn-stop" id="stopBtn"><span>Stop</span></button>
          </div>

          <div class="status" id="status">Ready</div>
          </div><!-- /app-body -->
          <div class="art"><img src="fiddler.png" alt="Pen-and-ink drawing of a fiddle"></div>
      </div>

      <script>
          // ===================================================================
          // MetroDrone - Metronome + Drone App
          // ===================================================================

          // --- NOTE MAPPING: Root + Fifth for each chromatic root ---
          // Maps each root note to [root, fifth] in appropriate octaves for fiddle practice
          const NOTE_MAP = {
              'C':  ['C4', 'G4'],
              'C#': ['C#4', 'G#4'],
              'D':  ['D4', 'A4'],
              'D#': ['D#4', 'A#4'],
              'E':  ['E4', 'B4'],
              'F':  ['F4', 'C5'],
              'F#': ['F#4', 'C#5'],
              'G':  ['G3', 'D4'],
              'G#': ['G#3', 'D#4'],
              'A':  ['A3', 'E4'],
              'A#': ['A#3', 'F4'],
              'B':  ['B3', 'F#4']
          };

          // --- STATE ---
          let isPlaying = false;
          let audioInitialized = false;
          let droneSource = 'mp3'; // 'mp3' or 'tuning' ('warm' kept internally as MP3-load fallback)

          // --- SYNTHS & AUDIO ---

          // Metronome synth: short, clean kick/click sound
          const metronome = new Tone.MembraneSynth({
              pitchDecay: 0.008,
              octaves: 2,
              envelope: {
                  attack: 0.0006,
                  decay: 0.05,
                  sustain: 0
              }
          }).toDestination();

          // Drone synths: Different synth types
          // Warm pad synth (original): warm, filtered sound
          const warmSynth = new Tone.PolySynth(Tone.Synth, {
              oscillator: {
                  type: 'sine'
              },
              envelope: {
                  attack: 0.5,
                  decay: 0.1,
                  sustain: 0.9,
                  release: 1.0
              }
          });

          // Tuning tone synths: clean sine wave for tuning strings + fingers
          // Plays ONLY the selected note (no fifth), plus a quieter sine one
          // octave up so low notes (viola C3, G3) are audible on phone speakers
          const tuningSynth = new Tone.Synth({
              oscillator: {
                  type: 'sine'
              },
              envelope: {
                  attack: 0.05,
                  decay: 0,
                  sustain: 1.0,
                  release: 0.1
              }
          });

          const tuningOctaveSynth = new Tone.Synth({
              oscillator: {
                  type: 'sine'
              },
              envelope: {
                  attack: 0.05,
                  decay: 0,
                  sustain: 1.0,
                  release: 0.1
              }
          });

          // Low-pass filter for warmth (only used by warm synth)
          const warmFilter = new Tone.Filter({
              frequency: 2000,
              type: 'lowpass',
              rolloff: -12
          });

          // Map UI note names to MP3 file names
          const MP3_FILE_MAP = {
              'C':  'drone_C.mp3',
              'C#': 'drone_Cs.mp3',
              'D':  'drone_D.mp3',
              'D#': 'drone_Eb.mp3',
              'E':  'drone_E.mp3',
              'F':  'drone_F.mp3',
              'F#': 'drone_Fs.mp3',
              'G':  'drone_G.mp3',
              'G#': 'drone_Ab.mp3',
              'A':  'drone_A.mp3',
              'A#': 'drone_Bb.mp3',
              'B':  'drone_B.mp3'
          };

          // MP3 Players for all recorded drones
          // Create TWO player sets (A and B) for each note for crossfading
          const dronePlayers = {};

          // Initialize players for all notes
          Object.keys(MP3_FILE_MAP).forEach(note => {
              // Get the filename (no encoding needed now that # is removed from filenames)
              const url = MP3_FILE_MAP[note];

              dronePlayers[note] = {
                  A: new Tone.Player({
                      url: url,
                      autostart: false,
                      loop: false,
                      fadeIn: 0.01,
                      fadeOut: 0.01,
                      onload: () => {
                          console.log(`${note} drone MP3 (A) loaded successfully`);
                      },
                      onerror: (error) => {
                          console.error(`Error loading ${note} drone MP3 (A):`, error);
                      }
                  }),
                  B: new Tone.Player({
                      url: url,
                      autostart: false,
                      loop: false,
                      fadeIn: 0.01,
                      fadeOut: 0.01,
                      onload: () => {
                          console.log(`${note} drone MP3 (B) loaded successfully`);
                      },
                      onerror: (error) => {
                          console.error(`Error loading ${note} drone MP3 (B):`, error);
                      }
                  })
              };
          });

          // Crossfade duration in seconds
          const CROSSFADE_TIME = 4;

          // Gain nodes for volume control
          // Increased all gain values to match MP3 volume levels
          const metronomeGain = new Tone.Gain(4.0).toDestination();
          const warmSynthGain = new Tone.Gain(0.6).toDestination();
          const tuningGain = new Tone.Gain(0.6).toDestination();
          const tuningOctaveGain = new Tone.Gain(0.6); // feeds into tuningGain, scaled below
          const playerGain = new Tone.Gain(0.3).toDestination();

          // Octave harmonic is 75% quieter than the main tuning tone
          const OCTAVE_HARMONIC_LEVEL = 0.25;

          // Connect audio chain: metronome -> metronomeGain -> destination
          metronome.disconnect();
          metronome.connect(metronomeGain);

          // Connect audio chains for synths
          // Warm synth: warmSynth -> warmFilter -> warmSynthGain -> destination
          warmSynth.disconnect();
          warmSynth.connect(warmFilter);
          warmFilter.connect(warmSynthGain);

          // Tuning synths: main sine -> tuningGain -> destination
          // Octave harmonic: octaveSynth -> tuningOctaveGain (fixed 25%) -> tuningGain
          // so the volume slider scales both together
          tuningSynth.disconnect();
          tuningSynth.connect(tuningGain);
          tuningOctaveSynth.disconnect();
          tuningOctaveSynth.connect(tuningOctaveGain);
          tuningOctaveGain.connect(tuningGain);
          tuningOctaveGain.gain.value = OCTAVE_HARMONIC_LEVEL;

          // Connect all drone players to playerGain
          Object.keys(dronePlayers).forEach(note => {
              dronePlayers[note].A.connect(playerGain);
              dronePlayers[note].B.connect(playerGain);
          });

          // Track current note, which player is active, and crossfade interval
          let currentDroneNote = null;
          let currentPlayer = 'A';
          let crossfadeInterval = null;
          let mp3UpgradeToken = 0; // invalidates pending synth→strings upgrades

          // --- TRANSPORT SETUP ---
          Tone.Transport.bpm.value = 80;

          // Metronome click counter and scheduling
          let clickCount = 0;
          let metronomeScheduled = false;

          // --- DOM ELEMENTS ---
          const tempoNumber = document.getElementById('tempoNumber');
          const tempoSlider = document.getElementById('tempoSlider');
          const droneSourceSelect = document.getElementById('droneSource');
          const droneRootSelect = document.getElementById('droneRoot');
          const droneRootGroup = document.getElementById('droneRootGroup');
          const tempoGroup = document.getElementById('tempoGroup');
          const metronomeVolumeGroup = document.getElementById('metronomeVolumeGroup');
          const fingerboardDisplay = document.getElementById('fingerboardDisplay');
          const tuningControls = document.getElementById('tuningControls');
          const tuningNoteSelect = document.getElementById('tuningNote');
          const tuningOctaveSelect = document.getElementById('tuningOctave');
          const stringButtons = document.querySelectorAll('.string-btn');
          const droneVolumeSlider = document.getElementById('droneVolume');
          const metronomeVolumeSlider = document.getElementById('metronomeVolume');
          const startBtn = document.getElementById('startBtn');
          const stopBtn = document.getElementById('stopBtn');
          const statusDiv = document.getElementById('status');

          // --- HELPER FUNCTIONS ---

          // Update status message
          function setStatus(message, isPlaying = false) {
              statusDiv.textContent = message;
              if (isPlaying) {
                  statusDiv.classList.add('playing');
              } else {
                  statusDiv.classList.remove('playing');
              }
          }

          // Start crossfade loop for MP3 drone
          function startCrossfadeDrone(note) {
              console.log(`Starting crossfade drone loop for ${note}`);

              // Clear any existing interval
              if (crossfadeInterval) {
                  clearInterval(crossfadeInterval);
              }

              currentDroneNote = note;
              const playerA = dronePlayers[note].A;
              const playerB = dronePlayers[note].B;

              // Check if MP3 is loaded
              if (!playerA.loaded) {
                  console.log(`${note} MP3 not loaded yet, using synth`);
                  return false;
              }

              // Check if player has a valid buffer
              if (!playerA.buffer) {
                  console.error(`${note} player has no buffer`);
                  return false;
              }

              // Get MP3 duration
              const duration = playerA.buffer.duration;
              console.log(`${note} MP3 duration:`, duration, 'seconds');

              // Ensure players are connected and ready
              if (!playerA.output || !playerB.output) {
                  console.error(`${note} players not properly connected`);
                  return false;
              }

              try {
                  // Start first player immediately
                  playerA.volume.value = 0; // Start at full volume (0 dB)
                  playerA.start();
                  console.log(`Player A started for ${note}`);
                  currentPlayer = 'A';

                  // Set up crossfade loop
                  // Start next player CROSSFADE_TIME seconds before current one ends
                  const loopTime = (duration - CROSSFADE_TIME) * 1000; // Convert to milliseconds

                  crossfadeInterval = setInterval(() => {
                      try {
                          if (currentPlayer === 'A') {
                              // Start player B, it will crossfade with A
                              playerB.start();
                              playerB.volume.value = 0;
                              currentPlayer = 'B';
                              console.log(`Crossfading ${note} to player B`);
                          } else {
                              // Start player A, it will crossfade with B
                              playerA.start();
                              playerA.volume.value = 0;
                              currentPlayer = 'A';
                              console.log(`Crossfading ${note} to player A`);
                          }
                      } catch (error) {
                          console.error(`Error in crossfade loop:`, error);
                      }
                  }, loopTime);

                  return true;
              } catch (error) {
                  console.error(`Error starting player:`, error);
                  return false;
              }
          }

          // --- TUNING TONE HELPERS ---

          const NOTE_ORDER = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

          // Notes that have a "Highest" (octave 6) option - ceiling is D6
          function noteHasOctave6(note) {
              return NOTE_ORDER.indexOf(note) <= NOTE_ORDER.indexOf('D');
          }

          // Get the selected tuning note, clamped to the C3-D6 range
          // If the note has no octave 6, keep the note and drop to octave 5
          function getTuningNote() {
              const note = tuningNoteSelect.value;
              let octave = parseInt(tuningOctaveSelect.value);

              if (octave === 6 && !noteHasOctave6(note)) {
                  octave = 5;
                  tuningOctaveSelect.value = '5';
              }

              return note + octave;
          }

          // Hide the "Highest (6)" option when the selected note is above D
          function updateOctaveOptions() {
              const note = tuningNoteSelect.value;
              const option6 = tuningOctaveSelect.querySelector('option[value="6"]');
              const available = noteHasOctave6(note);
              option6.disabled = !available;
              option6.hidden = !available;
          }

          // --- FINGERBOARD DIAGRAM ---
          // Brand-matched to the Chord Backup Handbook diagrams
          // (cream / FiddleHed red / ink, Karla-style type)

          const FB_RED = '#990034';
          const FB_INK = '#1d1a16';
          const FB_GRAY = '#666666';
          const FB_FAINT = '#d8cfbe';
          const FB_CREAM = '#FBF6EC';
          const FB_FONT = "Karla, -apple-system, BlinkMacSystemFont, sans-serif";

          // Strings as [label, absolute pitch value] where value = octave*12 + chromatic index
          const VIOLIN_STRINGS = [['G', 43], ['D', 50], ['A', 57], ['E', 64]];
          const VIOLA_STRINGS = [['C', 36], ['G', 43], ['D', 50], ['A', 57]];

          // FiddleHed finger labels by semitones above the open string
          const FINGER_LABELS = ['0', 'L1', '1', 'L2', '2', '3', 'H3', '4'];

          function renderFingerboard(note, octave) {
              const v = octave * 12 + NOTE_ORDER.indexOf(note);

              // Notes below violin G3 live on the viola's C string
              const strings = v < 43 ? VIOLA_STRINGS : VIOLIN_STRINGS;
              const isViola = v < 43;

              // Pick the string: highest string where the note sits in first position
              // (top string also carries the high notes C6-D6)
              let si = -1, semi = 0;
              for (let i = strings.length - 1; i >= 0; i--) {
                  const s = v - strings[i][1];
                  if (s >= 0 && (s < 7 || i === strings.length - 1)) {
                      si = i;
                      semi = s;
                      break;
                  }
              }
              if (si < 0) return ''; // out of range, shouldn't happen

              const finger = semi <= 7 ? FINGER_LABELS[semi] : null;
              const highPos = semi > 7;

              // Geometry (scaled port of the handbook renderer, reference width 68)
              const w = 128, h = 170;
              const k = w / 68;
              const padX = 9 * k;
              const top = 26 * k;
              const bot = 26 * k;
              const span = w - 2 * padX;
              const xs = [];
              for (let i = 0; i < 4; i++) xs.push(padX + span * i / 3);
              const boardTop = top;
              const boardBot = h - bot;

              // Board normally spans 6 semitones; stretch for high notes so the dot fits
              const semiMax = Math.max(6, semi);
              const y = (s) => boardTop + (boardBot - boardTop) * (s / semiMax);

              const out = [`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg">`];

              // String labels
              strings.forEach(([label], i) => {
                  const on = i === si;
                  out.push(`<text x="${xs[i].toFixed(1)}" y="${(top - 15 * k).toFixed(1)}" text-anchor="middle" font-family="${FB_FONT}" font-size="${(8.5 * k).toFixed(1)}" font-weight="${on ? '700' : '400'}" fill="${on ? FB_RED : FB_FAINT}">${label}</text>`);
              });

              // Nut
              out.push(`<rect x="${(padX - 3 * k).toFixed(1)}" y="${(boardTop - 2.2 * k).toFixed(1)}" width="${(span + 6 * k).toFixed(1)}" height="${(2.6 * k).toFixed(1)}" fill="${FB_INK}"/>`);

              // Strings
              strings.forEach((_, i) => {
                  const on = i === si;
                  out.push(`<line x1="${xs[i].toFixed(1)}" y1="${boardTop.toFixed(1)}" x2="${xs[i].toFixed(1)}" y2="${boardBot.toFixed(1)}" stroke="${on ? FB_INK : FB_FAINT}" stroke-width="${((on ? 1.15 : 0.7) * k).toFixed(2)}"/>`);
              });

              // Finger dot / open marker
              const x = xs[si];
              if (semi === 0) {
                  out.push(`<circle cx="${x.toFixed(1)}" cy="${(boardTop - 8 * k).toFixed(1)}" r="${(3.4 * k).toFixed(1)}" fill="none" stroke="${FB_RED}" stroke-width="${(1.3 * k).toFixed(2)}"/>`);
              } else {
                  const cy = y(semi);
                  out.push(`<circle cx="${x.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(7.2 * k).toFixed(1)}" fill="${FB_RED}"/>`);
                  if (finger) {
                      out.push(`<text x="${x.toFixed(1)}" y="${(cy + 2.9 * k).toFixed(1)}" text-anchor="middle" font-family="${FB_FONT}" font-size="${(8 * k).toFixed(1)}" font-weight="700" fill="${FB_CREAM}">${finger}</text>`);
                  }
              }

              // Note name below the active string
              const displayNote = note.replace('#', '♯');
              out.push(`<text x="${x.toFixed(1)}" y="${(boardBot + 13 * k).toFixed(1)}" text-anchor="middle" font-family="${FB_FONT}" font-size="${(8.5 * k).toFixed(1)}" font-weight="700" fill="${FB_INK}">${displayNote}</text>`);

              // Caption for viola / high-position notes
              if (isViola || highPos) {
                  const caption = isViola ? 'viola C string' : 'high position';
                  out.push(`<text x="${(w / 2).toFixed(1)}" y="${(h - 3 * k).toFixed(1)}" text-anchor="middle" font-family="${FB_FONT}" font-size="${(6.5 * k).toFixed(1)}" font-weight="600" fill="${FB_GRAY}">${caption}</text>`);
              }

              out.push('</svg>');
              return out.join('');
          }

          function updateFingerboard() {
              fingerboardDisplay.innerHTML = renderFingerboard(
                  tuningNoteSelect.value,
                  parseInt(tuningOctaveSelect.value)
              );
          }

          // Highlight the string button matching the current picker selection (if any)
          function syncStringButtons() {
              const note = tuningNoteSelect.value;
              const octave = tuningOctaveSelect.value;
              stringButtons.forEach(btn => {
                  const matches = btn.dataset.note === note && btn.dataset.octave === octave;
                  btn.classList.toggle('active', matches);
              });
          }

          // Show/hide controls based on mode
          // Tuning mode: no tempo, no metronome volume, no drone root - just the tone
          function updateSourceUI() {
              const isTuning = droneSource === 'tuning';
              tuningControls.style.display = isTuning ? 'block' : 'none';
              droneRootGroup.style.display = isTuning ? 'none' : 'block';
              tempoGroup.style.display = isTuning ? 'none' : 'block';
              metronomeVolumeGroup.style.display = isTuning ? 'none' : 'block';
          }

          // Start the drone with current root note
          function startDrone() {
              const root = droneRootSelect.value;
              const notes = NOTE_MAP[root];

              console.log(`Starting drone for ${root}, source: ${droneSource}`);

              // Cancel any pending synth→strings upgrade from a previous start
              mp3UpgradeToken++;

              // ALWAYS stop everything first
              warmSynth.releaseAll();
              tuningSynth.triggerRelease();
              tuningOctaveSynth.triggerRelease();
              stopCrossfadeDrone();

              // Get current volume setting
              const sliderValue = parseInt(droneVolumeSlider.value);
              const gain = (sliderValue / 100) * 2.0; // Increased to 2.0 to match MP3 volume

              // Mute all drone sources
              warmSynthGain.gain.value = 0;
              playerGain.gain.value = 0;
              tuningGain.gain.value = 0;

              // Use selected drone source - ONLY unmute and trigger the selected one
              if (droneSource === 'mp3') {
                  // Try to use MP3 first, fall back to warm synth if not available
                  const mp3Started = startCrossfadeDrone(root);
                  if (mp3Started) {
                      console.log(`Using MP3 for ${root} drone, setting gain to ${gain}`);
                      playerGain.gain.value = gain; // Unmute only MP3
                      console.log(`Player gain set to ${playerGain.gain.value}`);
                  } else {
                      console.log(`MP3 not loaded for ${root}, using warm synth fallback`);
                      warmSynthGain.gain.value = gain; // Unmute only warm synth
                      warmSynth.triggerAttack(notes);
                      scheduleStringsUpgrade(root); // swap to strings when loaded
                  }
              } else if (droneSource === 'warm') {
                  console.log(`Using warm synth for ${root} drone, setting gain to ${gain * 0.7}`);
                  warmSynthGain.gain.value = gain * 0.7; // Unmute only warm synth (30% quieter to match MP3)
                  // Add lower octave notes for thickness
                  // Create lower octave versions by parsing note and dropping octave number
                  const lowerNotes = notes.map(note => {
                      const noteName = note.slice(0, -1); // Get note name without octave
                      const octave = parseInt(note.slice(-1)); // Get octave number
                      return noteName + (octave - 1); // Drop by one octave
                  });
                  // Combine original notes with lower octave for thick, rich sound
                  const thickNotes = [...notes, ...lowerNotes];
                  warmSynth.triggerAttack(thickNotes);
                  console.log(`Warm synth triggered with notes: ${thickNotes.join(', ')}`);
              } else if (droneSource === 'tuning') {
                  const tuningNote = getTuningNote();
                  // Octave harmonic: same note name, one octave up
                  const octaveNote = tuningNote.slice(0, -1) + (parseInt(tuningNote.slice(-1)) + 1);
                  console.log(`Using tuning tone: ${tuningNote} (+ octave harmonic ${octaveNote})`);
                  tuningGain.gain.value = gain * 0.5; // sine waves sound louder than pads at equal gain
                  tuningSynth.triggerAttack(tuningNote);
                  tuningOctaveSynth.triggerAttack(octaveNote);
              }
          }

          // If we started on the synth fallback, switch to the recorded strings
          // the moment their MP3 finishes loading. Fixes the recurring "organ
          // tone" bug: after a deploy busts the cache, the first Start can beat
          // the MP3 download and the app used to stay on synth all session.
          function scheduleStringsUpgrade(root) {
              const token = mp3UpgradeToken;
              const watcher = setInterval(() => {
                  if (token !== mp3UpgradeToken) { clearInterval(watcher); return; }
                  if (!isPlaying || droneSource !== 'mp3' || droneRootSelect.value !== root) {
                      clearInterval(watcher);
                      return;
                  }
                  if (dronePlayers[root].A.loaded) {
                      clearInterval(watcher);
                      console.log(`${root} strings loaded — upgrading from synth fallback`);
                      warmSynth.releaseAll();
                      warmSynthGain.gain.value = 0;
                      if (startCrossfadeDrone(root)) {
                          playerGain.gain.value = (parseInt(droneVolumeSlider.value) / 100) * 2.0;
                      }
                  }
              }, 250);
          }

          // Stop crossfade drone
          function stopCrossfadeDrone() {
              if (crossfadeInterval) {
                  clearInterval(crossfadeInterval);
                  crossfadeInterval = null;
              }

              // Stop all players for the current note
              if (currentDroneNote && dronePlayers[currentDroneNote]) {
                  dronePlayers[currentDroneNote].A.stop();
                  dronePlayers[currentDroneNote].B.stop();
              }

              currentDroneNote = null;
          }

          // Stop the drone
          function stopDrone() {
              warmSynth.releaseAll();
              tuningSynth.triggerRelease();
              tuningOctaveSynth.triggerRelease();
              stopCrossfadeDrone();
          }

          // --- EVENT HANDLERS ---

          // Sync tempo number input and slider - instant updates
          tempoNumber.addEventListener('input', (e) => {
              const value = Math.max(40, Math.min(200, parseInt(e.target.value) || 40));
              tempoNumber.value = value;
              tempoSlider.value = value;
              Tone.Transport.bpm.value = value; // Instant update, no ramp
          });

          tempoSlider.addEventListener('input', (e) => {
              const value = parseInt(e.target.value);
              tempoNumber.value = value;
              Tone.Transport.bpm.value = value; // Instant update, no ramp
          });

          // Update drone source (restart drone if playing)
          droneSourceSelect.addEventListener('change', (e) => {
              droneSource = e.target.value;
              updateSourceUI();
              if (isPlaying) {
                  stopDrone();
                  startDrone();
              }
          });

          // Tuning note/octave pickers (restart tone if playing)
          function onTuningSelectionChange() {
              getTuningNote(); // drops octave 6 to 5 if the note has no octave 6
              updateOctaveOptions();
              syncStringButtons();
              updateFingerboard();
              if (isPlaying && droneSource === 'tuning') {
                  stopDrone();
                  startDrone();
              }
          }

          tuningNoteSelect.addEventListener('change', () => {
              // Notes below G have no violin octave 3 (that's viola territory).
              // When changing NOTE lands there, bump to Mid (4) so violinists
              // aren't surprised. Viola players can still pick Low manually
              // via the octave dropdown afterward.
              if (tuningOctaveSelect.value === '3' &&
                  NOTE_ORDER.indexOf(tuningNoteSelect.value) < NOTE_ORDER.indexOf('G')) {
                  tuningOctaveSelect.value = '4';
              }
              onTuningSelectionChange();
          });
          tuningOctaveSelect.addEventListener('change', onTuningSelectionChange);

          // Open-string buttons: set the pickers and restart tone
          stringButtons.forEach(btn => {
              btn.addEventListener('click', () => {
                  tuningNoteSelect.value = btn.dataset.note;
                  tuningOctaveSelect.value = btn.dataset.octave;
                  onTuningSelectionChange();
              });
          });

          // Update drone root note (restart drone if playing) - instant
          droneRootSelect.addEventListener('change', () => {
              if (isPlaying) {
                  stopDrone();
                  startDrone();
              }
          });

          // Update drone volume - instant response
          // Only controls the currently active drone source
          droneVolumeSlider.addEventListener('input', (e) => {
              const value = parseInt(e.target.value);
              // Using linear scaling for more predictable control
              const gain = (value / 100) * 2.0; // Max 2.0 gain to match MP3 volume

              // Only update the gain for the active source
              if (droneSource === 'mp3') {
                  playerGain.gain.value = gain;
              } else if (droneSource === 'warm') {
                  warmSynthGain.gain.value = gain * 0.7; // 30% quieter to match MP3
              } else if (droneSource === 'tuning') {
                  tuningGain.gain.value = gain * 0.5; // sine waves sound louder at equal gain
              }
          });

          // Update metronome volume - instant response
          // Metronome is short transient, needs higher gain to match perceived loudness
          metronomeVolumeSlider.addEventListener('input', (e) => {
              const value = parseInt(e.target.value);
              // Using linear scaling with higher multiplier
              const gain = (value / 100) * 36.0; // Max 36.0 gain - metronome needs much higher gain to compete with continuous drone
              metronomeGain.gain.value = gain; // Instant, no ramp
          });

          // Start button: Initialize audio context and start transport + drone
          startBtn.addEventListener('click', async () => {
              console.log('>>> START BUTTON CLICKED <<<');
              console.log('isPlaying:', isPlaying);

              if (isPlaying) {
                  console.log('Already playing, ignoring click');
                  return; // Already playing, ignore
              }

              try {
                  console.log('Starting playback initialization...');
                  setStatus('Loading audio...', false);

                  // Initialize Tone.js audio context (required for mobile browsers and Safari)
                  if (!audioInitialized) {
                      console.log('Initializing audio context...');
                      console.log('Context state BEFORE Tone.start():', Tone.context.state);

                      await Tone.start();
                      console.log('Tone.start() completed, state:', Tone.context.state);

                      // Aggressive resume attempts for iOS Safari in iframes
                      let attempts = 0;
                      while (Tone.context.state !== 'running' && attempts < 5) {
                          attempts++;
                          console.log(`Attempt ${attempts} to resume audio context...`);

                          // Try resuming the underlying Web Audio context directly
                          await Tone.context.resume();
                          console.log(`After resume attempt ${attempts}, state:`, Tone.context.state);

                          // Wait a bit before checking again
                          await new Promise(resolve => setTimeout(resolve, 100));
                      }

                      if (Tone.context.state !== 'running') {
                          console.error('❌ FAILED to start audio context after 5 attempts!');
                          console.error('Current state:', Tone.context.state);
                          throw new Error('Audio context stuck in suspended state. This may be due to iframe restrictions.');
                      }

                      // Additional mobile Safari fix: force a sound to unlock audio
                      console.log('Creating unlock oscillator...');
                      const unlockOsc = new Tone.Oscillator(440, 'sine').toDestination();
                      unlockOsc.volume.value = -Infinity; // Silent
                      unlockOsc.start();
                      unlockOsc.stop('+0.1');
                      unlockOsc.dispose();
                      console.log('Unlock oscillator created and disposed');

                      audioInitialized = true;
                      console.log('✓ Audio context initialized successfully, state:', Tone.context.state);
                  } else {
                      console.log('Audio already initialized, state:', Tone.context.state);
                  }

                  // Wait for the selected drone MP3 to load if using mp3 source
                  if (droneSource === 'mp3') {
                      const root = droneRootSelect.value;
                      const playerA = dronePlayers[root].A;

                      if (!playerA.loaded) {
                          console.log(`Waiting for ${root} MP3 to load...`);
                          try {
                              await new Promise((resolve, reject) => {
                                  const timeout = setTimeout(() => {
                                      reject(new Error('MP3 loading timeout - file may not exist on server'));
                                  }, 5000);

                                  // Check if already loaded
                                  if (playerA.loaded) {
                                      clearTimeout(timeout);
                                      resolve();
                                      return;
                                  }

                                  // Wait for load event
                                  const checkLoaded = setInterval(() => {
                                      if (playerA.loaded) {
                                          clearInterval(checkLoaded);
                                          clearTimeout(timeout);
                                          resolve();
                                      }
                                  }, 100);
                              });
                              console.log(`${root} MP3 loaded successfully`);
                          } catch (error) {
                              console.error(`Failed to load ${root} MP3:`, error.message);
                              console.log('Strings not ready — starting with synth, will upgrade when loaded');
                              // IMPORTANT: do NOT set droneSource = 'warm' here. A previous
                              // version did that, which permanently silenced the strings for
                              // the whole session even after the MP3s finished loading (the
                              // recurring "organ tone" bug after every deploy). startDrone()
                              // falls back per-call and upgrades automatically via
                              // scheduleStringsUpgrade().
                          }
                      } else {
                          console.log(`${root} MP3 already loaded`);
                      }
                  }

                  // Additional delay for mobile browsers to fully stabilize
                  await new Promise(resolve => setTimeout(resolve, 200));

                  // Verify audio context is still running before starting
                  if (Tone.context.state !== 'running') {
                      console.log('Context stopped, resuming again...');
                      await Tone.context.resume();
                  }

                  // Schedule metronome clicks AFTER audio context is ready (critical for mobile Safari)
                  if (!metronomeScheduled) {
                      console.log('Scheduling metronome clicks...');
                      Tone.Transport.scheduleRepeat((time) => {
                          try {
                              // No metronome during tuning tone - nobody tunes to a kick drum
                              if (droneSource === 'tuning') return;
                              metronome.triggerAttackRelease('C2', '16n', time);
                              clickCount++;
                              if (clickCount <= 5 || clickCount % 10 === 0) {
                                  console.log(`Metronome click #${clickCount} at time ${time}`);
                              }
                          } catch (error) {
                              console.error(`Error triggering metronome:`, error);
                          }
                      }, '4n');
                      metronomeScheduled = true;
                      console.log('Metronome clicks scheduled successfully');
                  }

                  // Start transport and drone
                  console.log('Starting transport and drone...');
                  console.log('Transport state before start:', Tone.Transport.state);
                  Tone.Transport.start();
                  console.log('Transport state after start:', Tone.Transport.state);
                  console.log('Transport BPM:', Tone.Transport.bpm.value);

                  startDrone();

                  // Verify metronome gain is set correctly
                  console.log('Metronome gain value:', metronomeGain.gain.value);

                  isPlaying = true;
                  setStatus('Playing...', true);
                  console.log('=== Playback started successfully ===');
                  console.log('Audio context state:', Tone.context.state);
                  console.log('Expected: You should hear metronome clicks at', Tone.Transport.bpm.value, 'BPM');
                  console.log('Watch console for "Metronome click" messages');

              } catch (error) {
                  console.error('Error starting:', error);
                  setStatus('Error: ' + error.message);
                  isPlaying = false;
              }
          });

          // Stop button: Stop transport and drone immediately
          stopBtn.addEventListener('click', () => {
              if (!isPlaying) return; // Not playing, safe no-op

              console.log('Stopping transport and drone...');
              Tone.Transport.stop();
              stopDrone();

              // Reset click counter for next session
              clickCount = 0;

              isPlaying = false;
              setStatus('Stopped');
              console.log('Stopped successfully');
          });

          // Initialize volume gains based on slider default values (50)
          const initialDroneGain = (50 / 100) * 2.0; // 50% of max 2.0
          const initialMetronomeGain = (50 / 100) * 36.0; // 50% of max 36.0
          warmSynthGain.gain.value = initialDroneGain * 0.7; // 30% quieter to match MP3
          playerGain.gain.value = initialDroneGain;
          metronomeGain.gain.value = initialMetronomeGain;

          // Initialize tuning UI state
          updateSourceUI();
          updateOctaveOptions();
          syncStringButtons();
          updateFingerboard();

          // Spacebar to start/stop
          document.addEventListener('keydown', (e) => {
              // Check if spacebar is pressed
              if (e.code === 'Space' || e.key === ' ') {
                  // Always handle spacebar for start/stop, even if a control has focus
                  e.preventDefault(); // Prevent page scroll and default actions

                  if (isPlaying) {
                      stopBtn.click(); // Trigger stop
                  } else {
                      startBtn.click(); // Trigger start
                  }
              }
          });

          // Check which MP3 files are loaded after a delay
          setTimeout(() => {
              const loadedFiles = [];
              const failedFiles = [];
              Object.keys(dronePlayers).forEach(note => {
                  if (dronePlayers[note].A.loaded) {
                      loadedFiles.push(note);
                  } else {
                      failedFiles.push(note);
                  }
              });
              console.log('=== MP3 Loading Status ===');
              if (loadedFiles.length > 0) {
                  console.log('✓ Loaded MP3s:', loadedFiles.join(', '));
              }
              if (failedFiles.length > 0) {
                  console.warn('✗ Failed to load:', failedFiles.join(', '));
                  console.warn('Make sure these files are uploaded to the server:');
                  failedFiles.forEach(note => {
                      console.warn(`  - ${MP3_FILE_MAP[note]}`);
                  });
              }
              console.log('=========================');
          }, 3000);

          // Detect iOS and show warning about silent switch
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                       (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

          if (isIOS) {
              const warning = document.getElementById('iosWarning');
              if (warning) {
                  warning.style.display = 'block';
                  console.log('iOS detected - showing silent switch warning');
              }
          }

          // Log initialization info for debugging
          console.log('=== MetroDrone Initialization ===');
          console.log('Tone.js version:', Tone.version);
          console.log('Audio context state:', Tone.context.state);
          console.log('Sample rate:', Tone.context.sampleRate);
          console.log('User agent:', navigator.userAgent);
          console.log('Platform:', navigator.platform);
          console.log('Touch support:', 'ontouchstart' in window);
          console.log('iOS device:', isIOS);
          console.log('MP3 files to load:', Object.keys(dronePlayers).length);
          console.log('=================================');
          console.log('MetroDrone initialized and ready');
